<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    :root{
      --bg: #f4f7fb;
      --card: #ffffff;
      --panel: #eef3f8;
      --accent: #5b21b6; /* deeper purple */
      --accent-2: #e63946;
      --muted: #6b7280;
      --text: #0f172a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .container{
      max-width:1100px;
      margin:36px auto;
      padding:18px;
    }
    .panel{
      background:var(--panel);
      border-radius:14px;
      padding:18px;
      box-shadow:0 6px 18px rgba(16,24,40,0.06);
    }
    .layout{
      display:flex;
      gap:22px;
      align-items:flex-start;
    }
    /* Form column */
    .form-col{
      flex:1 1 480px;
      min-width:260px;
    }
    /* Messages column */
    .msgs-col{
      width:420px;
      max-width:40%;
      min-width:260px;
    }
    h1{color:var(--accent); margin:0 0 8px 0; font-size:26px}
    h2{margin:0; font-size:18px}
    .subtle{color:var(--muted); font-size:13px}

    label{display:block; margin-top:12px; font-weight:600; color:var(--muted)}
    input[type=text], input[type=email], textarea{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid rgba(15,23,42,0.06);
      margin-top:8px;
      font-size:15px;
      background:var(--card);
      transition:box-shadow .15s ease, transform .08s ease;
    }
    input:focus, textarea:focus{ outline:none; box-shadow:0 6px 18px rgba(91,33,182,0.08); transform:translateY(-1px)}
    textarea{min-height:140px}
    .row{display:flex; gap:12px}
    .btn{
      background:var(--accent);
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      margin-top:14px;
      box-shadow:0 6px 18px rgba(91,33,182,0.12);
    }
    .btn.secondary{background:#6b7280; box-shadow:none}
    .btn.small{padding:6px 8px; font-size:13px; border-radius:8px}
    .msg-card{
      background:var(--card);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      border:1px solid rgba(15,23,42,0.04);
      word-break:break-word;
      display:flex;
      gap:12px;
      align-items:flex-start;
      position:relative;
    }
    .avatar{
      width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:white; font-weight:700; flex:0 0 44px; font-size:15px;
    }
    .meta{font-size:13px; color:var(--muted)}
    .controls{display:flex; gap:8px; align-items:center; justify-content:flex-end}

    .messages-header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px}

    /* small screens: stack columns */
    @media (max-width:880px){
      .layout{flex-direction:column}
      .msgs-col{width:100%; max-width:none}
    }
    /* very small devices: reduce paddings */
    @media (max-width:420px){
      .container{padding:10px}
      input[type=text], input[type=email], textarea{font-size:14px}
      .btn{padding:8px 10px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel layout">
      <div class="form-col">
        <h1>Contact Me</h1>
        <p class="subtle">Send a message — I'll keep your messages here in the browser for now.</p>
        <form id="contactForm" class="contact-form" novalidate>
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required>

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" required>

          <label for="contactInput">Contact (phone or social)</label>
          <input id="contactInput" name="contact" type="text" placeholder="Enter contact">

          <label for="message">Your message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

          <div class="row">
            <button class="btn" type="submit">Send message</button>
            <button class="btn secondary" id="clearForm" type="button">Clear</button>
          </div>
        </form>
      </div>

      <div class="msgs-col">
        <div class="messages-header">
          <div>
            <h2 style="color:var(--accent);">Messages</h2>
            <div id="messageCount" class="subtle">0 messages</div>
          </div>
          <div class="controls">
            <button class="btn secondary" id="exportCsv">Export CSV</button>
            <button class="btn secondary" id="clearAll">Clear All</button>
          </div>
        </div>

        <div id="messagesList" class="panel" style="max-height:520px; overflow:auto; padding:12px"></div>
      </div>
    </div>
  </div>

  <script src="./contact.js"></script>
</body>
</html>
