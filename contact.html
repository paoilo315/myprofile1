<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Simple styling -->

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
    }

    #successMsg {
      color: green;
      display: none;
    }

    #errorMsg {
      color: red;
      display: none;
    }
  </style>

</head>

<body>

<div class="container">
  <h2>Contact</h2>

  <form id="contactForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="contact" placeholder="Phone" required>
    <textarea id="message" placeholder="Message" required></textarea>

```
<button type="submit">Send Message</button>
```

  </form>

  <p id="successMsg"></p>
  <p id="errorMsg"></p>
</div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://npgwvbgyfxptkkcondav.supabase.co",
    "sb_publishable_Sl97ODLF3RzUhsaOBkBctA_D8dYpqno"
  );

  const form = document.getElementById("contactForm");
  const successMsg = document.getElementById("successMsg");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    successMsg.style.display = "none";
    errorMsg.style.display = "none";

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const contact = document.getElementById("contact").value;
    const message = document.getElementById("message").value;

    const { error } = await supabase.from("messages").insert([
      { name, email, contact, message }
    ]);

    if (error) {
      console.error(error);
      errorMsg.innerText = "❌ Failed to send message";
      errorMsg.style.display = "block";
    } else {
      successMsg.innerText = "✅ Message sent successfully!";
      successMsg.style.display = "block";
      form.reset();
    }
  });

});
</script>

</body>
</html>
