<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    :root{
      --bg: #f4f7fb;
      --card: #ffffff;
      --panel: #eef3f8;
      --accent: #5b21b6;
      --accent-2: #e63946;
      --success: #10b981;
      --muted: #6b7280;
      --text: #0f172a;
      --border: rgba(15,23,42,0.06);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Helvetica Neue',Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .container{
      max-width:1100px;
      margin:36px auto;
      padding:18px;
    }
    .panel{
      background:var(--panel);
      border-radius:14px;
      padding:18px;
      box-shadow:0 6px 18px rgba(16,24,40,0.06);
    }
    /* Make the main layout vertical rather than horizontal */
    .layout{
      display:flex;
      flex-direction:column; /* stack vertically */
      gap:22px;
      align-items:stretch; /* take full width */
    }
    .form-col{
      flex:1 1 auto;
      min-width:0;
    }
    .msgs-col{
      width:100%;
      max-width:none;
      min-width:0;
    }
    h1{color:var(--accent); margin:0 0 8px 0; font-size:26px}
    h2{margin:0; font-size:18px}
    .subtle{color:var(--muted); font-size:13px}

    label{display:block; margin-top:12px; font-weight:600; color:var(--muted)}
    input[type=text], input[type=email], textarea, input[type=search]{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid var(--border);
      margin-top:8px;
      font-size:15px;
      background:var(--card);
      transition:box-shadow .15s ease, transform .08s ease;
    }
    input:focus, textarea:focus{ outline:none; box-shadow:0 6px 18px rgba(91,33,182,0.08); transform:translateY(-1px)}
    textarea{min-height:140px; resize:vertical}
    .row{display:flex; gap:12px; flex-wrap:wrap}
    .btn{
      background:var(--accent);
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
      margin-top:14px;
      transition:all .2s ease;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(91,33,182,0.2)}
    .btn.secondary{background:#6b7280}
    .btn.secondary:hover{background:#5a5f66}
    .btn.small{padding:6px 8px; font-size:13px; border-radius:8px; margin:0}
    .btn.danger{background:var(--accent-2)}
    .btn.success{background:var(--success)}

    .msg-card{
      background:var(--card);
      border-radius:12px;
      padding:12px;
      margin-bottom:12px;
      border:1px solid var(--border);
      word-break:break-word;
      display:flex;
      gap:12px;
      position:relative;
      transition:all .2s ease;
      cursor:pointer;
    }
    .msg-card:hover{box-shadow:0 4px 12px rgba(91,33,182,0.06)}
    .msg-card.unread{background:#f3f0ff; border-color:rgba(91,33,182,0.1); font-weight:500}
    .avatar{
      width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:white; font-weight:700; flex:0 0 44px; font-size:15px;
    }
    .meta{font-size:13px; color:var(--muted)}
    .content{flex:1}
    .controls{display:flex; gap:8px; align-items:center; justify-content:flex-end; flex-wrap:wrap}
    .messages-header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px}
    .search-box{width:100%; margin-bottom:10px}
    .filter-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
    .tag{
      background:rgba(107,119,140,0.2);
      color:var(--muted);
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
      cursor:pointer;
      border:1px solid transparent;
      transition:all .2s ease;
    }
    .tag:hover{background:rgba(91,33,182,0.1); color:var(--accent)}
    .tag.active{background:var(--accent); color:white}
    .badge{background:rgba(91,33,182,0.1); color:var(--accent); padding:2px 6px; border-radius:4px; font-size:11px; font-weight:600}
    .snackbar{
      position:fixed;
      bottom:20px;
      right:20px;
      background:var(--success);
      color:white;
      padding:12px 16px;
      border-radius:10px;
      box-shadow:0 6px 18px rgba(16,24,40,0.2);
      z-index:9999;
      animation:slideIn .3s ease;
    }
    @keyframes slideIn{from{transform:translateX(400px); opacity:0}to{transform:translateX(0); opacity:1}}
    .pagination{display:flex; gap:6px; justify-content:center; align-items:center; margin-top:12px}
    .pagination button{padding:4px 8px; font-size:12px}
    .pagination .active{background:var(--accent); color:white}
    /* keep small screens responsive */
    @media (max-width:880px){
      .layout{flex-direction:column}
      .msgs-col{width:100%; max-width:none}
    }
    @media (max-width:420px){
      .container{padding:10px}
      input[type=text], input[type=email], textarea, input[type=search]{font-size:14px}
      .btn{padding:8px 10px}
      .msg-card{flex-direction:column}
      .avatar{margin-bottom:8px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel layout">
      <div class="form-col">
        <h1>Contact Me</h1>
        <p class="subtle">Send a message — all messages are saved and searchable locally in your browser.</p>
        <form id="contactForm" novalidate>

          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required>

          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="Enter your email" required>

          <label for="contactInput">Contact (phone or social)</label>
          <input id="contactInput" name="contact" type="text" placeholder="Enter contact">

          <label for="message">Your message</label>
          <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

          <div class="row">
            <button class="btn" type="submit">Send message</button>
            <button class="btn secondary" id="clearForm" type="button">Clear</button>
          </div>
        </form>
      </div>

      <div class="msgs-col">
        <div class="messages-header">
          <div>
            <h2 style="color:var(--accent);">Messages</h2>
            <div id="messageCount" class="subtle">0 messages</div>
          </div>
          <div class="controls">
            <button class="btn secondary btn-small" id="exportCsv" title="Download as CSV">Export</button>
            <button class="btn secondary btn-small" id="clearAll" title="Clear all messages">Clear All</button>
          </div>
        </div>

        <!-- Search -->
        <input type="search" id="searchBox" class="search-box" placeholder="Search messages...">
        
        <!-- Filter -->
        <div class="filter-tags">
          <button class="tag active" data-filter="all">All</button>
          <button class="tag" data-filter="unread">Unread</button>
        </div>

        <!-- Messages list -->
        <div id="messagesList" class="panel" style="max-height:520px; overflow:auto; padding:12px"></div>

        <!-- Pagination -->
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </div>

  <script src="./contact.js"></script>
</body>
</html>
