<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .msg {
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    .success { color: green; }
    .error { color: red; }
  </style>

</head>

<body>

<div class="container">
  <h2>Contact Us</h2>

  <form id="contactForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="contact" placeholder="Phone Number" required>
    <textarea id="message" placeholder="Your Message" required></textarea>

```
<button type="submit">Send Message</button>
    <p id="successMsg" class="msg success"></p>
<p id="errorMsg" class="msg error"></p>

<p id="successMsg" class="msg success">✅ Message sent!</p>
<p id="errorMsg" class="msg error">❌ Failed to send</p>
```

  </form>
</div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const supabase = window.supabase.createClient(
    "https://npgwvbgyfxptkkcondav.supabase.co",
    "sb_publishable_Sl97ODLF3RzUhsaOBkBctA_D8dYpqno"
  );

  const form = document.getElementById("contactForm");
  const successMsg = document.getElementById("successMsg");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    successMsg.style.display = "none";
    errorMsg.style.display = "none";

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const contact = document.getElementById("contact").value;
    const message = document.getElementById("message").value;

    const { error } = await supabase.from("messages").insert([
      { name, email, contact, message }
    ]);

    if (error) {
      errorMsg.innerText = "❌ Failed to send message";
      errorMsg.style.display = "block";
    } else {
      successMsg.innerText = "✅ Message sent successfully!";
      successMsg.style.display = "block";
      form.reset();
    }
  });

});

</body>
</html>
